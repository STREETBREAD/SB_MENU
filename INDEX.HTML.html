<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>모바일 메뉴판 — QR용</title>
  <meta name="description" content="QR로 열어보는 모바일 메뉴판 예제" />
  <style>
    /* --- 스타일은 동일 (생략 없이 포함) --- */
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#f59e0b;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071029 0%,var(--bg) 100%);color:#e6eef8}
    .app{max-width:900px;margin:0 auto;padding:18px 16px 80px}
    header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .logo{display:flex;flex-direction:column}
    .brand{font-weight:700;font-size:18px;letter-spacing:0.2px}
    .sub{font-size:12px;color:var(--muted)}
    /* ... 나머지 스타일은 동일 ... */
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="logo">
        <div class="brand">BAR 2호점 — 메뉴</div>
        <div class="sub">QR을 찍으면 열립니다 • 모바일 최적화</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button id="langBtn" class="ghost" title="언어 전환">KO</button>
        <button id="shareBtn" class="ghost" title="공유">공유</button>
      </div>
    </header>

    <div class="searchrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"></path><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" opacity="0.6"></circle></svg>
        <input id="searchInput" placeholder="검색어로 메뉴 찾기 (예: 칵테일, 안주)" aria-label="메뉴 검색" />
      </div>
    </div>

    <div class="filters" id="categories" role="tablist" aria-label="카테고리"></div>

    <main>
      <section class="menu-list" id="menuList"></section>
      <div id="empty" class="empty" style="display:none">조건에 맞는 메뉴가 없습니다.</div>
    </main>
  </div>

  <footer>
    <button id="printBtn" class="ghost">프린트</button>
    <button id="downloadBtn" class="ghost">메뉴 JSON 저장</button>
    <button id="contactBtn" class="btn">직원 호출</button>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-hidden="true">
    <div class="sheet" id="sheet">
      <div class="row">
        <div>
          <div id="mdTitle" style="font-weight:700;font-size:16px"></div>
          <div id="mdDesc" style="color:var(--muted);font-size:13px;margin-top:6px"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="mdPrice" class="tag" style="font-weight:700"></div>
          <button id="mdClose" class="ghost">닫기</button>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button id="addFav" class="ghost">즐겨찾기</button>
        <button id="orderBtn" class="btn" style="margin-left:auto">주문하기</button>
      </div>
    </div>
  </div>

  <script>
    /* --- 스크립트 부분 동일 (메뉴 데이터, 검색, 카테고리, 모달, 이벤트 핸들러 등) --- */
  </script>
</body>
</html>
